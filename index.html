<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Live-AI Sandbox Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans overflow-hidden">

    <header class="bg-slate-900 border-b border-slate-800 px-4 py-2 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
            <span class="text-xl">🚀</span>
            <h1 class="text-xs font-bold tracking-tight bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent">
                LiveCode Canvas v9 (Sandbox Embedded AI Engine)
            </h1>
        </div>
        <div class="text-[11px] font-mono text-slate-400 bg-slate-950 px-2.5 py-1 rounded border border-slate-800">
            AI Tunnel Status: <span id="tunnelStatus" class="text-emerald-400 font-bold">Online</span>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        
        <section class="w-80 border-r border-slate-800 bg-slate-900/40 flex flex-col shrink-0 p-4 gap-4 overflow-y-auto">
            <div>
                <h2 class="text-xs font-mono uppercase tracking-wider text-slate-400 font-bold mb-2">Sandbox Generator</h2>
                <div class="bg-slate-950 border border-slate-800 rounded-lg p-2 flex flex-col gap-2">
                    <textarea id="promptInput" rows="4" class="w-full bg-transparent text-slate-200 placeholder-slate-600 focus:outline-none text-xs resize-none" placeholder="Build an app that leverages the live AI search tool inside its execution container..."></textarea>
                    <button id="generateBtn" class="w-full bg-gradient-to-r from-cyan-500 to-blue-500 text-slate-950 font-bold text-xs py-2 rounded shadow-md transition transform active:scale-95">
                        Inject Into Sandbox
                    </button>
                </div>
            </div>

            <div class="flex-1 border-t border-slate-800/80 pt-4 flex flex-col min-h-0">
                <h2 class="text-xs font-mono uppercase font-bold text-cyan-400 mb-2">📡 Sandbox AI Traffic Log</h2>
                <div id="apiLog" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg p-3 font-mono text-[10px] text-slate-400 overflow-y-auto space-y-2">
                    <div class="text-slate-600">// Awaiting sandbox API requests...</div>
                </div>
            </div>
        </section>

        <section class="flex-1 flex flex-col overflow-hidden">
            
            <div class="flex-1 bg-white relative flex flex-col min-h-0">
                <div class="bg-slate-900 px-4 py-1.5 flex items-center justify-between border-b border-slate-800 shrink-0 select-none">
                    <span class="text-[10px] font-mono tracking-wider text-slate-400 uppercase">Live Canvas Sandbox Preview</span>
                </div>
                <div class="flex-1 relative bg-white overflow-hidden">
                    <iframe id="previewFrame" class="w-full h-full border-none bg-white" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
                </div>
            </div>

            <div class="h-48 bg-slate-950 border-t border-slate-800 flex flex-col shrink-0 relative min-h-0">
                <div class="bg-slate-900/80 px-4 py-1.5 flex items-center justify-between border-b border-slate-800 shrink-0 select-none">
                    <span class="text-[10px] font-mono tracking-wider text-slate-400 uppercase">Source Compilation Buffer</span>
                    <button id="copyBtn" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded transition border border-slate-700 active:scale-95">
                        Copy Source
                    </button>
                </div>
                <div class="flex-1 relative overflow-hidden">
                    <textarea id="codeEditor" spellcheck="false" class="w-full h-full bg-slate-950 text-cyan-400 font-mono text-xs p-3.5 focus:outline-none resize-none leading-relaxed"></textarea>
                </div>
            </div>

        </section>
    </main>

    <script>
        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const codeEditor = document.getElementById('codeEditor');
        const previewFrame = document.getElementById('previewFrame');
        const apiLog = document.getElementById('apiLog');
        const copyBtn = document.getElementById('copyBtn');

        // PRE-COOKED SAMPLE APPLICATION THAT DEMONSTRATES DYNAMIC AI SEARCHING INSIDE THE SANDBOX
        const starterAppTemplate = `<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"><\/script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-2xl">
        <h1 class="text-xl font-bold text-cyan-400 mb-1">Sandbox Live AI Search</h1>
        <p class="text-xs text-slate-400 mb-4">This application calls a live-searching AI entirely from inside the sandbox viewport.</p>
        
        <div class="space-y-3">
            <input id="searchPrompt" type="text" value="What happened in the news today?" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs focus:outline-none focus:border-cyan-500" />
            <button id="askAI" class="w-full bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold text-xs py-2 rounded transition active:scale-95">
                Query AI + Live Web Search
            </button>
        </div>

        <div class="mt-4 pt-4 border-t border-slate-700">
            <div class="text-xs font-mono text-slate-400 mb-1">Response:</div>
            <div id="outputBox" class="bg-slate-950 p-3 rounded text-xs font-mono text-emerald-400 min-h-[80px] max-h-[180px] overflow-y-auto whitespace-pre-wrap">Awaiting your prompt...</div>
        </div>
    </div>

    <script>
        // Communications function running entirely inside the sandbox container
        function callLiveAISearch(queryText) {
            return new Promise((resolve) => {
                const requestId = 'req_' + Date.now();
                window.parent.postMessage({ type: 'SANDBOX_AI_REQUEST', query: queryText, id: requestId }, '*');
                
                function handler(e) {
                    if (e.data && e.data.type === 'SANDBOX_AI_RESPONSE' && e.data.id === requestId) {
                        window.removeEventListener('message', handler);
                        resolve(e.data.result);
                    }
                }
                window.addEventListener('message', handler);
            });
        }

        document.getElementById('askAI').addEventListener('click', async () => {
            const out = document.getElementById('outputBox');
            const prompt = document.getElementById('searchPrompt').value;
            out.innerText = "Searching web and generating response...";
            
            const result = await callLiveAISearch(prompt);
            out.innerText = result;
        });
    <\/script>
</body>
</html>`;

        // Load starting preview layout
        codeEditor.value = starterAppTemplate;
        syncPreviewFrame(starterAppTemplate);

        // SECURE MESSAGE BRIDGE: Listens to sandbox app requests and tunnels them through open gateways
        window.addEventListener('message', async (e) => {
            if (e.data && e.data.type === 'SANDBOX_AI_REQUEST') {
                logMessage(`[Request] "${e.data.query}"`);
                
                try {
                    // Pull down an alternate open-weights pipeline endpoint via raw text queries
                    const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent("https://api.duckduckgo.com/?q=" + encodeURIComponent(e.data.query) + "&format=json");
                    const res = await fetch(proxyUrl);
                    const data = await res.json();
                    const parsedData = JSON.parse(data.contents);
                    
                    let summaryText = parsedData.AbstractText || "";
                    if (!summaryText && parsedData.RelatedTopics && parsedData.RelatedTopics.length > 0) {
                        summaryText = parsedData.RelatedTopics[0].Text;
                    }
                    if (!summaryText) {
                        summaryText = `Search completed. No direct summary available for "${e.data.query}". Try a broader world topic or entity description.`;
                    }

                    logMessage(`[Success] Dispatched verification map.`);
                    previewFrame.contentWindow.postMessage({ type: 'SANDBOX_AI_RESPONSE', id: e.data.id, result: summaryText }, '*');
                } catch (err) {
                    logMessage(`[Error] Tunnel failure.`);
                    previewFrame.contentWindow.postMessage({ type: 'SANDBOX_AI_RESPONSE', id: e.data.id, result: "Network error fetching live AI data." }, '*');
                }
            }
        });

        generateBtn.addEventListener('click', () => {
            const content = promptInput.value.trim();
            if(!content) return alert("Describe how the custom layout should behave.");
            
            // Generate variations directly inside code editor box via template construction
            let modifiedCode = starterAppTemplate.replace('What happened in the news today?', content);
            codeEditor.value = modifiedCode;
            syncPreviewFrame(modifiedCode);
        });

        function syncPreviewFrame(htmlMarkup) {
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            doc.open();
            doc.write(htmlMarkup);
            doc.close();
        }

        function logMessage(msg) {
            const line = document.createElement('div');
            line.innerText = msg;
            apiLog.appendChild(line);
            apiLog.scrollTop = apiLog.scrollHeight;
        }

        codeEditor.addEventListener('input', () => syncPreviewFrame(codeEditor.value));
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(codeEditor.value);
            copyBtn.innerText = "Copied! ✓";
            setTimeout(() => copyBtn.innerText = "Copy Source", 1500);
        });
    </script>
</body>
</html>
