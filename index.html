<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ChatGPT Live Workspace (Pages Safe)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans overflow-hidden">

    <div id="lockScreen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center p-4 transition-all duration-300">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl">
            <div class="text-4xl mb-4">🔒</div>
            <h2 class="text-xl font-bold mb-2 text-slate-200">Workspace Locked</h2>
            <p class="text-xs text-slate-400 mb-6">Enter your passcode to decrypt the workspace engine.</p>
            
            <div class="flex flex-col gap-3">
                <input id="passcodeInput" type="password" placeholder="••••" class="bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-center font-mono text-xl tracking-widest focus:outline-none focus:border-amber-500 text-amber-400 placeholder-slate-700">
                <button id="unlockBtn" class="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-slate-950 font-bold py-2.5 rounded-lg transition transform active:scale-95 text-sm">
                    Unlock & Decrypt
                </button>
                <p id="lockError" class="text-rose-500 text-xs font-medium min-h-[1rem] mt-1 invisible">Invalid passcode. Decryption failed.</p>
            </div>
        </div>
    </div>

    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
            <span class="text-xl">⚡</span>
            <h1 class="text-base font-bold tracking-tight bg-gradient-to-r from-orange-400 to-amber-400 bg-clip-text text-transparent">
                ChatGPT LiveCode Canvas
            </h1>
        </div>
        
        <div class="flex items-center gap-2 bg-slate-950/50 border border-slate-800 rounded px-3 py-1 text-xs text-slate-400">
            <span id="statusIndicator" class="h-2 w-2 rounded-full bg-emerald-500"></span>
            <span id="statusText" class="font-mono">Ready</span>
        </div>
    </header>

    <section class="p-4 bg-slate-900/60 border-b border-slate-800 shrink-0">
        <div class="max-w-7xl mx-auto flex gap-3 items-end bg-slate-950 border border-slate-700 rounded-lg p-2 focus-within:border-amber-500 transition shadow-inner">
            <textarea id="promptInput" rows="2" class="flex-1 bg-transparent text-slate-200 placeholder-slate-500 focus:outline-none text-sm resize-none px-2 py-1" placeholder="What are we building today?"></textarea>
            <button id="generateBtn" class="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-slate-950 font-bold text-sm px-5 py-2.5 rounded-md shadow-md transition transform active:scale-95 flex items-center gap-1.5 whitespace-nowrap">
                <span>Code It</span> 🚀
            </button>
        </div>
    </section>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <section class="w-full md:w-1/2 flex flex-col border-b md:border-b-0 md:border-r border-slate-800 bg-slate-900/20 h-1/2 md:h-full">
            <div class="bg-slate-900/80 px-4 py-2 flex items-center justify-between border-b border-slate-800 shrink-0">
                <span class="text-xs font-mono tracking-wider text-slate-400 uppercase">Source Code</span>
                <button id="copyBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded transition border border-slate-700 active:scale-95">
                    Copy Code
                </button>
            </div>
            <div class="flex-1 relative overflow-hidden">
                <textarea id="codeEditor" spellcheck="false" class="w-full h-full bg-slate-950/40 text-amber-400 font-mono text-sm p-4 focus:outline-none resize-none leading-relaxed" placeholder=""></textarea>
            </div>
        </section>

        <section class="w-full md:w-1/2 h-1/2 md:h-full flex flex-col bg-white">
            <div class="bg-slate-900 px-4 py-2 flex items-center border-b border-slate-800 shrink-0">
                <span class="text-xs font-mono tracking-wider text-slate-400 uppercase">Live Preview</span>
            </div>
            <div class="flex-1 relative bg-white">
                <iframe id="previewFrame" class="w-full h-full border-none bg-white" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
            </div>
        </section>
        
    </main>

    <script>
        // PASTING ZONE: Paste your long encrypted text from Step 1 between the quotes below!
        const ENCRYPTED_API_KEY = "U2FsdGVkX19uF4T/zNl1hEtzatAX7DRLzQ1zwLKW6Xzg9FRzFzjIWCjxpwSjQrEtyAA5Z/J1d7YVJFeYc+5ak/+fGuCamJhpex5YwJ3f5GWAP1Nv/oBKIPyln3XOOkEVp57emRCWuxuN50ZwRZY4kKFGb2OFuOWmiWiDheZr2dioSNQgeyJwEgaJri0JCugVrz90Bm5YbirjTGily+Bqi5ultc6dVVgGZ8VW78k0qafuFOuyCYIHnT2jHgtoQLxx";
        const MODEL_NAME = "gpt-4o-mini"; 

        // Core variables
        let decryptedKey = "";

        // UI Target Hooks
        const lockScreen = document.getElementById('lockScreen');
        const passcodeInput = document.getElementById('passcodeInput');
        const unlockBtn = document.getElementById('unlockBtn');
        const lockError = document.getElementById('lockError');
        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const codeEditor = document.getElementById('codeEditor');
        const previewFrame = document.getElementById('previewFrame');
        const statusText = document.getElementById('statusText');
        const statusIndicator = document.getElementById('statusIndicator');
        const copyBtn = document.getElementById('copyBtn');

        // Decryption & Validation Engine
        function handleUnlock() {
            const enteredPass = passcodeInput.value.trim();
            
            try {
                // Attempt to decrypt the API Key string using crypto-js matching your password
                const bytes = CryptoJS.AES.decrypt(ENCRYPTED_API_KEY, enteredPass);
                const resultText = bytes.toString(CryptoJS.enc.Utf8);
                
                // If it decrypts back into a valid-looking OpenAI string, pass through
                if (resultText.startsWith("sk-") && enteredPass === "5435") {
                    decryptedKey = resultText;
                    lockScreen.classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => lockScreen.remove(), 300);
                } else {
                    throw new Error();
                }
            } catch (e) {
                lockError.classList.remove('invisible');
                passcodeInput.value = "";
                passcodeInput.focus();
            }
        }

        unlockBtn.addEventListener('click', handleUnlock);
        passcodeInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleUnlock(); });
        passcodeInput.addEventListener('input', () => lockError.classList.add('invisible'));

        // OpenAI Pipeline Execution
        generateBtn.addEventListener('click', async () => {
            const prompt = promptInput.value.trim();
            if (!prompt) return alert('Please describe what you want to build.');

            generateBtn.disabled = true;
            setAppStatus("thinking", "Brainstorming...");

            try {
                const systemInstructions = "You are an elite expert frontend developer. Create a single-file interactive application (HTML, CSS, and JS combined seamlessly) matching the user's prompt. You may use modern CDNs like Tailwind CSS (https://cdn.tailwindcss.com) or FontAwesome icons freely to ensure high-end aesthetics. Return ONLY raw executable code starting with <!DOCTYPE html> and closing with </html>. Absolutely NO markdown block formatting wrapping code (do not use ```html), no backticks, and no conversation prose.";

                const response = await fetch("[https://api.openai.com/v1/chat/completions](https://api.openai.com/v1/chat/completions)", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${decryptedKey}`
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: [
                            { role: "system", content: systemInstructions },
                            { role: "user", content: prompt }
                        ],
                        temperature: 0.2
                    })
                });
                
                if (!response.ok) throw new Error(await response.text());
                const data = await response.json();
                let cleanCode = filterMarkdownWrappers(data.choices[0].message.content);

                runLiveStreamEngine(cleanCode);

            } catch (err) {
                console.error(err);
                setAppStatus("error", "API Error");
                alert("Failed to communicate with OpenAI:\n" + err.message);
                generateBtn.disabled = false;
            }
        });

        function filterMarkdownWrappers(text) {
            let processed = text.trim();
            processed = processed.replace(/^```html\s*/i, "");
            processed = processed.replace(/^```\s*/i, "");
            if (processed.endsWith("```")) {
                processed = processed.slice(0, -3);
            }
            return processed.trim();
        }

        function runLiveStreamEngine(fullText) {
            setAppStatus("coding", "Writing code...");
            codeEditor.value = "";
            
            let currentOffset = 0;
            const charactersPerTick = Math.max(3, Math.ceil(fullText.length / 120)); 
            
            const animationClock = setInterval(() => {
                currentOffset += charactersPerTick;
                if (currentOffset >= fullText.length) {
                    currentOffset = fullText.length;
                    clearInterval(animationClock);
                    setAppStatus("ready", "Ready");
                    generateBtn.disabled = false;
                }
                
                const slice = fullText.slice(0, currentOffset);
                codeEditor.value = slice;
                codeEditor.scrollTop = codeEditor.scrollHeight;
                
                syncPreviewFrame(slice);
            }, 8);
        }

        function syncPreviewFrame(htmlMarkup) {
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            doc.open();
            doc.write(htmlMarkup);
            doc.close();
        }

        codeEditor.addEventListener('input', () => {
            syncPreviewFrame(codeEditor.value);
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(codeEditor.value);
            const initialText = copyBtn.innerText;
            copyBtn.innerText = "Copied! ✓";
            setTimeout(() => copyBtn.innerText = initialText, 1500);
        });

        function setAppStatus(type, label) {
            statusText.innerText = label;
            statusIndicator.className = "h-2 w-2 rounded-full";
            
            if (type === "ready") {
                statusIndicator.classList.add("bg-emerald-500");
            } else if (type === "thinking") {
                statusIndicator.classList.add("bg-amber-500", "animate-pulse");
            } else if (type === "coding") {
                statusIndicator.classList.add("bg-orange-500", "animate-pulse");
            } else if (type === "error") {
                statusIndicator.classList.add("bg-rose-500");
            }
        }
    </script>
</body>
</html>
